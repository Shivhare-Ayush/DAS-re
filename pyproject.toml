[project]
name = "aegis-sre"
version = "0.1.0"
description = "Aegis: Autonomous Voice SRE & Zero-Trust Cloud Operator for Daytona HackSprint #6"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "fastapi>=0.111.0",
    "uvicorn>=0.30.0",
    "daytona>=0.1.0",
    "arize-phoenix>=4.0.0",
    "openinference-instrumentation-openai>=0.1.0",
    "elevenlabs>=1.0.0",
    "surrealdb>=0.3.0",
    "playwright>=1.44.0",
    "httpx>=0.27.0",
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "websockets>=12.0",
    "python-dotenv>=1.0.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
